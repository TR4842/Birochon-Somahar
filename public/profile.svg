<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F7D6C8" />
      <stop offset="100%" stop-color="#B7E4C7" />
    </linearGradient>
    <radialGradient id="ring" cx="0.5" cy="0.5" r="0.5">
      <stop offset="60%" stop-color="rgba(0,0,0,0)" />
      <stop offset="100%" stop-color="rgba(232,165,137,0.5)" />
    </radialGradient>
  </defs>

  <!-- Background circle -->
  <circle cx="100" cy="100" r="100" fill="url(#bg)" />

  <!-- Sea / water abstraction (bottom half) -->
  <g opacity="0.55">
    <path d="M 0 130 Q 50 120 100 130 T 200 130 L 200 200 L 0 200 Z" fill="#84A59D" />
    <path d="M 0 145 Q 50 135 100 145 T 200 145 L 200 200 L 0 200 Z" fill="#5C9385" opacity="0.5" />
    <path d="M 0 160 Q 50 152 100 160 T 200 160 L 200 200 L 0 200 Z" fill="#3B7A57" opacity="0.4" />
  </g>

  <!-- Boat railing -->
  <line x1="20" y1="180" x2="180" y2="150" stroke="#E5D5C8" stroke-width="3" />
  <line x1="20" y1="180" x2="40" y2="190" stroke="#E5D5C8" stroke-width="3" />
  <line x1="60" y1="172" x2="80" y2="182" stroke="#E5D5C8" stroke-width="3" />
  <line x1="100" y1="165" x2="120" y2="175" stroke="#E5D5C8" stroke-width="3" />
  <line x1="140" y1="158" x2="160" y2="168" stroke="#E5D5C8" stroke-width="3" />

  <!-- Person silhouette (head + shoulders) -->
  <!-- Hair -->
  <ellipse cx="100" cy="68" rx="28" ry="22" fill="#1F1A18" />
  <!-- Face -->
  <ellipse cx="100" cy="80" rx="24" ry="28" fill="#D4A374" />
  <!-- Beard / moustache -->
  <path d="M 80 90 Q 100 105 120 90 Q 118 100 100 102 Q 82 100 80 90 Z" fill="#1F1A18" opacity="0.85" />
  <!-- Sunglasses -->
  <ellipse cx="88" cy="78" rx="8" ry="6" fill="#1F1A18" />
  <ellipse cx="112" cy="78" rx="8" ry="6" fill="#1F1A18" />
  <line x1="96" y1="78" x2="104" y2="78" stroke="#1F1A18" stroke-width="2" />
  <!-- Shoulders / shirt (black button-down) -->
  <path d="M 50 180 Q 60 130 100 125 Q 140 130 150 180 L 150 200 L 50 200 Z" fill="#1F1A18" />
  <!-- Shirt collar V -->
  <path d="M 90 125 L 100 145 L 110 125 Z" fill="#D4A374" />
  <!-- Shirt center seam -->
  <line x1="100" y1="145" x2="100" y2="200" stroke="#3A2F2C" stroke-width="1" opacity="0.6" />
  <!-- Crossed arms hint -->
  <path d="M 65 165 Q 100 175 135 165" stroke="#1F1A18" stroke-width="14" stroke-linecap="round" fill="none" />
  <path d="M 65 165 Q 100 175 135 165" stroke="#3A2F2C" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.5" />

  <!-- Outer decorative ring -->
  <circle cx="100" cy="100" r="98" fill="none" stroke="url(#ring)" stroke-width="4" />
</svg>
